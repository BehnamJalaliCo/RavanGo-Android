name: Android CI

on:
  push:
    branches: [ main, "claude/**" ]
    tags: [ "v*" ]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  # Service configuration (all optional — the app runs fully offline without them).
  RAVANGO_SUPABASE_URL: ${{ secrets.RAVANGO_SUPABASE_URL }}
  RAVANGO_SUPABASE_ANON_KEY: ${{ secrets.RAVANGO_SUPABASE_ANON_KEY }}
  RAVANGO_GOOGLE_WEB_CLIENT_ID: ${{ secrets.RAVANGO_GOOGLE_WEB_CLIENT_ID }}
  RAVANGO_AI_GATEWAY_URL: ${{ secrets.RAVANGO_AI_GATEWAY_URL }}
  RAVANGO_OWNER_CODE_SHA256: ${{ secrets.RAVANGO_OWNER_CODE_SHA256 }}
  GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx4g

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Decrypt licensed brand font (Ravagh)
        env:
          RAVAGH_FONT_PASSPHRASE: ${{ secrets.RAVAGH_FONT_PASSPHRASE }}
        run: |
          # Trim stray whitespace/newlines that often sneak in when pasting a secret.
          PASS="$(printf '%s' "$RAVAGH_FONT_PASSPHRASE" | tr -d '[:space:]')"
          if [ -z "$PASS" ]; then
            echo "::warning::RAVAGH_FONT_PASSPHRASE secret not set — building with the open fallback font (Vazirmatn)."
            exit 0
          fi
          echo "Passphrase length: ${#PASS} (expected 40)"
          mkdir -p private/fonts/ravagh
          if gpg --batch --quiet --pinentry-mode loopback --passphrase "$PASS" \
               -d fonts-private/ravagh-fonts.tar.gz.gpg > "$RUNNER_TEMP/ravagh.tgz" \
             && tar -xzf "$RUNNER_TEMP/ravagh.tgz" -C private/fonts/ravagh; then
            echo "Brand font: Ravagh (licensed)"
          else
            rm -rf private/fonts/ravagh
            echo "::warning::Could not decrypt the Ravagh font (wrong RAVAGH_FONT_PASSPHRASE?) — building with the fallback font (Vazirmatn)."
          fi
          rm -f "$RUNNER_TEMP/ravagh.tgz"

      - name: Prepare release signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.RAVANGO_RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "RAVANGO_RELEASE_STORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "RAVANGO_RELEASE_STORE_PASSWORD=${{ secrets.RAVANGO_RELEASE_STORE_PASSWORD }}" >> "$GITHUB_ENV"
            echo "RAVANGO_RELEASE_KEY_ALIAS=${{ secrets.RAVANGO_RELEASE_KEY_ALIAS }}" >> "$GITHUB_ENV"
            echo "RAVANGO_RELEASE_KEY_PASSWORD=${{ secrets.RAVANGO_RELEASE_KEY_PASSWORD }}" >> "$GITHUB_ENV"
          else
            echo "::notice::No release keystore secret — release APK is signed with the shared debug key (not for Play upload)."
          fi

      - name: Unit tests
        run: ./gradlew testDebugUnitTest --stacktrace --continue

      - name: Build APKs (debug + release)
        run: ./gradlew :app:assembleDebug :app:assembleRelease --stacktrace

      - name: Build App Bundle (Google Play)
        run: ./gradlew :app:bundleRelease --stacktrace

      - name: Build Cafe Bazaar APK
        env:
          RAVANGO_DISTRIBUTION: bazaar
        run: |
          # Save the Google Play APK first; the Bazaar build reuses the same output path.
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk dist/RavanGo-release.apk
          ./gradlew :app:assembleRelease --stacktrace
          cp app/build/outputs/apk/release/app-release.apk dist/RavanGo-bazaar.apk

      - name: Lint
        run: ./gradlew :app:lintDebug --continue
        continue-on-error: true

      - name: Collect outputs
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/RavanGo-debug.apk
          cp app/build/outputs/bundle/release/*.aab dist/RavanGo-release.aab
          ls -la dist
          FONT=$(grep -o 'name="brand_font_name"[^>]*>[^<]*' core/designsystem/build/generated/brandFonts/res/values/brand_font.xml | sed 's/.*>//')
          echo "BRAND_FONT=${FONT:-unknown}" >> "$GITHUB_ENV"
          echo "Embedded brand font: ${FONT:-unknown}"

      - uses: actions/upload-artifact@v4
        with:
          name: ravango-apks
          path: dist/*
          retention-days: 30

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reports
          path: |
            **/build/reports/tests/
            app/build/reports/lint-results-debug.html
          retention-days: 7

      - name: Publish rolling "latest-build" pre-release
        if: github.event_name != 'pull_request' && !startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest-build --yes --cleanup-tag || true
          gh release create latest-build dist/* \
            --target "$GITHUB_SHA" --prerelease \
            --title "RavanGo latest build (#${{ github.run_number }})" \
            --notes "Automated build of ${GITHUB_SHA::7} from ${GITHUB_REF_NAME}. Install RavanGo-release.apk on any Android 8.0+ phone. Google Play: RavanGo-release.aab. Cafe Bazaar: RavanGo-bazaar.apk (needs the release keystore secrets). Brand font: ${BRAND_FONT}."

      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "RavanGo $GITHUB_REF_NAME" --generate-notes
