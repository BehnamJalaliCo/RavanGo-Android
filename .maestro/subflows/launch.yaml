# Starts (or restarts) the app with every runtime permission granted and lands on Home.
# Completes onboarding quickly if the app is on its first run, and dismisses the in-app
# "RavanGo closed unexpectedly" crash-report prompt (it means the app crashed earlier — it is screenshotted).
appId: com.ravango.app.debug
---
- launchApp:
    appId: com.ravango.app.debug
    stopApp: true
    permissions:
      all: allow
- extendedWaitUntil:
    visible: '.*Welcome to RavanGo.*|.*به روان.گو خوش آمدید.*|.*New recording.*|.*ضبط جدید.*|RavanGo closed unexpectedly|روان.گو دفعه.ی قبل ناگهان بسته شد|.*isn.t responding.*|.*keeps stopping.*'
    timeout: 45000
- runFlow: dismiss_system_dialogs.yaml
- extendedWaitUntil:
    visible: '.*Welcome to RavanGo.*|.*به روان.گو خوش آمدید.*|.*New recording.*|.*ضبط جدید.*|RavanGo closed unexpectedly|روان.گو دفعه.ی قبل ناگهان بسته شد'
    timeout: 30000
- runFlow:
    when:
      visible: 'RavanGo closed unexpectedly|روان.گو دفعه.ی قبل ناگهان بسته شد'
    commands:
      - takeScreenshot: crash_report_prompt
      - tapOn: 'Not now|فعلاً نه'
- runFlow:
    when:
      visible: '.*Welcome to RavanGo.*|.*به روان.گو خوش آمدید.*'
    file: onboarding_quick.yaml
- extendedWaitUntil:
    visible: '.*New recording.*|.*ضبط جدید.*'
    timeout: 30000
