[versions]
# Build
agp = "8.13.2"
kotlin = "2.2.21"
ksp = "2.2.21-2.0.5"
hilt = "2.57.2"
androidxHilt = "1.2.0"

# SDK levels
compileSdk = "36"
targetSdk = "36"
minSdk = "26"

# AndroidX
coreKtx = "1.16.0"
appcompat = "1.7.1"
activityCompose = "1.10.1"
lifecycle = "2.9.4"
navigation = "2.9.5"
composeBom = "2025.10.01"
room = "2.7.2"
datastore = "1.1.7"
work = "2.10.5"
splashscreen = "1.0.1"
profileinstaller = "1.4.1"
documentfile = "1.1.0"
exifinterface = "1.4.1"
credentials = "1.5.0"
googleid = "1.1.1"
browser = "1.9.0"

# Media / Vision
media3 = "1.8.0"
mlkitFace = "16.1.7"
# Beauty engine: MediaPipe Face Landmarker (478-point face mesh, blendshapes, pose)
mediapipeTasks = "1.0.0"

# Kotlin
coroutines = "1.10.2"
serialization = "1.9.0"

# Network
okhttp = "4.12.0"
anthropic = "2.65.0"

# Billing
billing = "8.0.0"

# Images
coil = "2.7.0"

# Licenses
aboutlibraries = "13.1.0"

# Testing
junit = "4.13.2"
truth = "1.4.4"
androidxTestExt = "1.3.0"
androidxTestRunner = "1.7.0"
espresso = "3.7.0"
robolectric = "4.15.1"
turbine = "1.2.1"

[libraries]
# AndroidX core
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "coreKtx" }
androidx-appcompat = { module = "androidx.appcompat:appcompat", version.ref = "appcompat" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activityCompose" }
